name: Security
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504
        with:
          languages: python
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4
