name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Validate release version
        shell: pwsh
        run: |
          $version = python -c 'from backburn import __version__; print(__version__)'
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: pip-audit -r requirements.txt
      - run: python tools/build_release.py
      - name: Smoke test packaged game
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Backburn/Backburn.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Packaged game failed' }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/Backburn-Windows-x64.zip dist/Backburn-Setup.exe dist/SHA256SUMS.txt --verify-tag --title "Backburn $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
