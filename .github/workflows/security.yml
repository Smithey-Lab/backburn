name: Security
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '30 6 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4
        with:
          languages: python
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4
