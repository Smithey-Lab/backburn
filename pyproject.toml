[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backburn"
version = "0.3.0"
description = "An original desktop wildfire tactics game"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary — personal project; see README"}
dependencies = ["numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
viewer = ["pygame-ce>=2.5.8"]
dev = ["pygame-ce>=2.5.8", "pytest>=8", "jsonschema>=4", "pyinstaller>=6", "ruff>=0.16", "pip-audit>=2.10"]

[project.scripts]
backburn = "backburn.__main__:main"
backburn-game = "backburn.game:main"

[tool.setuptools.packages.find]
include = ["backburn*"]

[tool.setuptools.package-data]
backburn = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["godot", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
